<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - Knihovnický Informační Systém</title>
    <link rel="icon" href="/static/icon.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="/">IS Knihovny</a>
            <ul>
                <li><a href="/login">Přihlášení</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <div class="login-box">
                <h1>Přihlášení</h1>
                
                <div id="error-message" class="alert alert-error hidden"></div>
                <div id="success-message" class="alert alert-success hidden"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Uživatelské jméno</label>
                        <input type="text" id="username" name="username" placeholder="Vaše jméno" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Heslo</label>
                        <input type="password" id="password" name="password" placeholder="Vaše heslo" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Přihlásit se</button>
                </form>

                <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                    <p style="color: var(--text-light); margin-bottom: 0.75rem;">
                        Pokud nemáte přístupové údaje,
                    </p>
                    <p style="font-size: 0.95rem; color: var(--text-color);">
                        prosím <strong>kontaktujte administrátora knihovny.</strong>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Knihovnícký Informační Systém. Všechna práva vyhrazena.</p>
    </footer>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username,
                        password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    successMessage.textContent = 'Přihlášení úspěšné, přesměrování...';
                    successMessage.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = '/catalog';
                    }, 1000);
                } else {
                    const error = await response.json();
                    errorMessage.textContent = error.detail || 'Chyba při přihlášení';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.textContent = 'Chyba při komunikaci se serverem';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
